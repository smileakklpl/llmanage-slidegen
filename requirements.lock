# requirements.lock — 完整傳遞依賴鎖定檔（含間接依賴）
#
# 這份檔案的用途與 requirements.txt 不同，兩者都要留：
#
#   requirements.txt              「我們直接 import 什麼」——人工維護，附選型理由
#   src/backend/requirements.txt  同上，backend 範圍
#   requirements.lock             「完整安裝了什麼」——機器產生，用於重現同一套環境
#
# requirements.txt 只釘直接依賴，間接依賴（anyio、certifi、pydantic-core…）
# 仍由 pip 當下解析，因此不同時間安裝可能得到不同組合。要重現 benchmark 數字
# 或排查「在我機器上是好的」這類問題時，必須用這份 lock。
#
# 產生方式（在已通過 scripts/verify_all.py 的環境中執行）：
#     .venv/bin/python -m pip freeze --exclude-editable > /tmp/freeze.txt
#     # 保留本說明區塊，把 /tmp/freeze.txt 內容接在後面
#
# 安裝方式：
#     python -m pip install -r requirements.lock
#
# 已知不在此檔中的項目：
#   - paddleocr / paddlepaddle：選用 OCR，見 src/backend/requirements-ocr.txt。
#     paddlepaddle 需從 PaddlePaddle 自己的 CPU index 安裝，pip freeze 無法表達。
#
# 環境基準：Python 3.12.4 / macOS arm64。
# 對應的驗收結果見 README「Benchmark 與驗收重現」一節。
#
# 這是機器產生的檔案，不要手改；改完 requirements.txt 之後重新產生。


