services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: slidegen-backend
    environment:
      - CORS_ORIGINS=["http://localhost","http://localhost:80"]
      - APP_NAME=slidegen-api
      - DEBUG=false
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - GENERATION_USE_FAKE_LLM=${GENERATION_USE_FAKE_LLM:-false}
      - GENERATION_SKIP_SEMANTIC_REVIEW=${GENERATION_SKIP_SEMANTIC_REVIEW:-false}
      # LLM 後端：Bedrock 走 EC2 Instance Profile 簽章，不需要 API key。
      - LLM_PROVIDER=${LLM_PROVIDER:-bedrock}
      - LLM_MODEL_DEFAULT=${LLM_MODEL_DEFAULT:-global.anthropic.claude-haiku-4-5-20251001-v1:0}
      - LLM_MODEL_INTENT=${LLM_MODEL_INTENT:-}
      - LLM_MODEL_CHART=${LLM_MODEL_CHART:-}
      - LLM_MODEL_WRITER=${LLM_MODEL_WRITER:-}
      - LLM_MODEL_WRITER_FALLBACK=${LLM_MODEL_WRITER_FALLBACK:-}
      - LLM_MODEL_WRITER_KEYPAGES=${LLM_MODEL_WRITER_KEYPAGES:-}
      - LLM_MODEL_REVIEWER=${LLM_MODEL_REVIEWER:-}
      - LLM_MODEL_MAILER=${LLM_MODEL_MAILER:-}
      - LLM_MAX_PARALLEL=${LLM_MAX_PARALLEL:-16}
      - LLM_BACKOFF_BASE=${LLM_BACKOFF_BASE:-1.0}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    container_name: slidegen-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
