services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: slidegen-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8100:8000"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: slidegen-backend
    depends_on:
      - dynamodb-local
    environment:
      - CORS_ORIGINS=["http://localhost","http://localhost:80"]
      - APP_NAME=slidegen-api
      - DEBUG=false
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - DYNAMODB_ENDPOINT_URL=${DYNAMODB_ENDPOINT_URL:-http://dynamodb-local:8000}
      - DYNAMODB_USERS_TABLE=${DYNAMODB_USERS_TABLE:-slidegen_users}
      - DYNAMODB_HISTORY_TABLE=${DYNAMODB_HISTORY_TABLE:-slidegen_history}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-ses}
      - SES_SENDER_EMAIL=${SES_SENDER_EMAIL:-ethanlin7890@gmail.com}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production-2024}
      - GENERATION_USE_FAKE_LLM=${GENERATION_USE_FAKE_LLM:-false}
      - GENERATION_SKIP_SEMANTIC_REVIEW=${GENERATION_SKIP_SEMANTIC_REVIEW:-false}
      - GENERATION_POLICY=${GENERATION_POLICY:-required}
      - GENERATION_DEADLINE_SECONDS=${GENERATION_DEADLINE_SECONDS:-1500}
      - GENERATION_RENDER_RESERVE_SECONDS=${GENERATION_RENDER_RESERVE_SECONDS:-240}
      - GENERATION_OUTPUT_RESERVE_SECONDS=${GENERATION_OUTPUT_RESERVE_SECONDS:-150}
      - GENERATION_MAX_CONCURRENT_JOBS=${GENERATION_MAX_CONCURRENT_JOBS:-1}
      - GENERATION_DEFAULT_CONTENT_PAGES=${GENERATION_DEFAULT_CONTENT_PAGES:-8}
      - GENERATION_MAX_CONTENT_PAGES=${GENERATION_MAX_CONTENT_PAGES:-15}
      - OCR_MAX_SECONDS=${OCR_MAX_SECONDS:-360}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-20}
      # LLM 後端：Bedrock 走 EC2 Instance Profile 簽章，不需要 API key。
      - LLM_PROVIDER=${LLM_PROVIDER:-bedrock}
      - LLM_MODEL_DEFAULT=${LLM_MODEL_DEFAULT:-global.anthropic.claude-opus-5}
      - LLM_MODEL_INTENT=${LLM_MODEL_INTENT:-}
      - LLM_MODEL_CHART=${LLM_MODEL_CHART:-}
      - LLM_MODEL_WRITER=${LLM_MODEL_WRITER:-}
      - LLM_MODEL_WRITER_FALLBACK=${LLM_MODEL_WRITER_FALLBACK:-}
      - LLM_MODEL_WRITER_KEYPAGES=${LLM_MODEL_WRITER_KEYPAGES:-}
      - LLM_MODEL_REVIEWER=${LLM_MODEL_REVIEWER:-}
      - LLM_MODEL_MAILER=${LLM_MODEL_MAILER:-}
      - LLM_MAX_PARALLEL=${LLM_MAX_PARALLEL:-4}
      - LLM_RPM_LIMIT=${LLM_RPM_LIMIT:-24}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - LLM_BACKOFF_BASE=${LLM_BACKOFF_BASE:-1.0}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    container_name: slidegen-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
