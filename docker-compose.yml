services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: slidegen-backend
    environment:
      - CORS_ORIGINS=["http://localhost","http://localhost:80"]
      - APP_NAME=slidegen-api
      - DEBUG=false
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    container_name: slidegen-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
