services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: slidegen-backend
    environment:
      - CORS_ORIGINS=["http://localhost","http://localhost:80"]
      - APP_NAME=slidegen-api
      - DEBUG=false
      # AWS 通用
      - AWS_REGION=us-east-1
      # S3 存儲
      - S3_ENABLED=true
      - S3_BUCKET=llmanage-slidegen-files
      # SES 寄信
      - EMAIL_PROVIDER=ses
      - SES_SENDER_EMAIL=ethanlin7890@gmail.com
      # Bedrock LLM
      - LLM_PROVIDER=bedrock
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    container_name: slidegen-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
