services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: slidegen-backend
    environment:
      - CORS_ORIGINS=["http://localhost","http://localhost:80"]
      - APP_NAME=slidegen-api
      - DEBUG=false
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-ses}
      - SES_SENDER_EMAIL=${SES_SENDER_EMAIL:-ethanlin7890@gmail.com}
      - GENERATION_USE_FAKE_LLM=${GENERATION_USE_FAKE_LLM:-false}
      - GENERATION_SKIP_SEMANTIC_REVIEW=${GENERATION_SKIP_SEMANTIC_REVIEW:-false}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    container_name: slidegen-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
