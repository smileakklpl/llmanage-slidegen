# 測試分成兩處，各自有相依與執行方式（見 .kiro/steering/structure.md）：
#
#   tests/              主管線，repo root 跑 pytest（本檔生效）
#   src/backend/tests/  ingestion，src/backend/ 下跑 pytest（該層有自己的 pytest.ini）
#
# 沒有這個 testpaths，root 的 pytest 會遞迴收進 src/backend/tests/，
# 而那批測試要 fastapi / PIL / reportlab / paddleocr 等重量級相依，
# 只想跑主管線的人會直接吃到一排 collection error。
[pytest]
testpaths = tests
addopts = -ra
