# 測試分成兩處，各自有相依與執行方式（見 .kiro/steering/structure.md）：
#
#   tests/              主管線，本檔生效
#   src/backend/tests/  ingestion，src/backend/ 下跑 pytest（該層有自己的 pytest.ini）
#
# 這份設定必須留在 repo root：pytest 只會用「執行目錄往上第一個找到」的
# ini 檔，放進 tests/ 底下反而找不到，會遞迴收進 src/backend/tests/
#（那批測試要 fastapi / PIL / reportlab / paddleocr 等重量級相依，
# 只想跑主管線的人會吃到一排 collection error）。實測驗證過這一點。
[pytest]
testpaths = tests
addopts = -ra
